name: Deploy API

# Deploy only after CI has actually finished and passed on main, and always
# deploy the exact commit CI validated — never whatever `origin/main` happens
# to point at by the time this workflow runs. A `push`-triggered "ci-gate"
# job (the previous approach) cannot see the outcome of another workflow; it
# just prints a message and always "passes", so a red CI run never blocked a
# deploy. `workflow_run` ties this workflow to a specific completed CI run
# and its `head_sha`, which is what we check out and ship.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  # workflow_run always runs workflow definitions from the default branch,
  # and we only ever react to CI runs on main (see branches filter above),
  # so a static group name is correct here (no risk of colliding refs).
  group: deploy-api-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy API to servers
    runs-on: ubuntu-latest
    environment: production
    # Branch names alone do not establish trust: fork PRs can also use main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - name: Checkout trusted release verifier
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
          # Full history so the "did anything relevant change" diff below
          # can compare against whatever commit is currently deployed,
          # however far back that is.
          fetch-depth: 0

      - name: Verify trusted release and select the exact tested commit
        run: python3 scripts/verify-deployment.py

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          chmod 600 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts || { echo "::error::DEPLOY_KNOWN_HOSTS is empty"; exit 1; }
          ssh-keygen -F "${{ secrets.PRIMARY_HOST }}" -f ~/.ssh/known_hosts >/dev/null || exit 1
          ssh-keygen -F "${{ secrets.STANDBY_HOST }}" -f ~/.ssh/known_hosts >/dev/null || exit 1
          cat > ~/.ssh/config << 'SSHEOF'
          Host primary
            HostName ${{ secrets.PRIMARY_HOST }}
            User root
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            LogLevel ERROR
          Host standby
            HostName ${{ secrets.STANDBY_HOST }}
            User root
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            LogLevel ERROR
          SSHEOF
          sed -i 's/^          //' ~/.ssh/config
          echo "SSH config written:"
          cat ~/.ssh/config

      - name: Detect roles and current deployed commit
        id: roles
        run: |
          echo "Testing SSH connectivity..."
          ssh primary "echo 'primary OK'" || { echo "::error::SSH to primary failed"; exit 1; }
          ssh standby "echo 'standby OK'" || { echo "::error::SSH to standby failed"; exit 1; }
          primary_is_recovery=$(ssh primary "sudo -u postgres psql -qtAX -c 'SELECT pg_is_in_recovery();'")
          echo "primary pg_is_in_recovery=$primary_is_recovery"
          if [[ "$primary_is_recovery" == "f" ]]; then
            echo "pg_primary=primary" >> "$GITHUB_OUTPUT"
          else
            echo "pg_primary=standby" >> "$GITHUB_OUTPUT"
          fi

          # This is also the backup/rollback reference: whatever commit is
          # currently live on the primary box before we touch anything.
          prev_sha="$(ssh primary 'cd /root/cipherscan && git rev-parse HEAD')"
          if [[ ! "$prev_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not read a valid current commit from primary (got: $prev_sha)"
            exit 1
          fi
          echo "Primary currently deployed at $prev_sha"
          echo "prev_sha=$prev_sha" >> "$GITHUB_OUTPUT"

      - name: Check whether API-relevant files changed
        id: changes
        env:
          NEW_SHA: ${{ github.event.workflow_run.head_sha }}
          PREV_SHA: ${{ steps.roles.outputs.prev_sha }}
        run: |
          python3 scripts/api-deployment-relevance.py \
            --previous "$PREV_SHA" --current "$NEW_SHA" >> "$GITHUB_OUTPUT"

      - name: Deploy to primary box
        if: steps.changes.outputs.deploy == 'true'
        env:
          NEW_SHA: ${{ github.event.workflow_run.head_sha }}
          PREV_SHA: ${{ steps.roles.outputs.prev_sha }}
        run: |
          # Defense in depth: these are re-validated on the runner even
          # though they were already produced by trusted prior steps, before
          # they're interpolated into a remote SSH command string.
          [[ "$NEW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Bad NEW_SHA"; exit 1; }
          [[ "$PREV_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Bad PREV_SHA"; exit 1; }

          ssh primary "NEW_SHA=$NEW_SHA PREV_SHA=$PREV_SHA bash -s" << 'REMOTE'
          set -euo pipefail
          cd /root/cipherscan

          # Previous-release backup: the git history itself is the backup —
          # every prior deployed commit stays fully checkoutable — but we
          # also drop a marker file so a human (or a future workflow step)
          # can see what the last known-good release was without querying git.
          echo "$PREV_SHA" > /root/cipherscan/.previous-deploy-sha

          deploy_sha() {
            local sha="$1"
            git fetch origin main
            git merge-base --is-ancestor "$sha" origin/main
            git checkout --detach "$sha"
            npm ci --omit=dev --no-audit --no-fund
            (cd server/api && npm ci --omit=dev --no-audit --no-fund)
            systemctl restart zcash-api-mainnet.service
          }

          wait_healthy() {
            local _attempt
            for _attempt in $(seq 1 10); do
              if curl -sf http://localhost:3001/health >/dev/null \
                 && curl -sf http://localhost:3001/health/deep >/dev/null; then
                return 0
              fi
              sleep 3
            done
            return 1
          }

          echo "Deploying $NEW_SHA to primary"
          deploy_sha "$NEW_SHA"

          if wait_healthy; then
            echo "Primary healthy at $NEW_SHA (liveness + deep health OK)"
            systemctl restart cipherscan-bot.service || true
            echo "Primary API + bot deploy complete"
          else
            echo "::error::Primary failed readiness/deep-health at $NEW_SHA — automatic rollback to $PREV_SHA"
            deploy_sha "$PREV_SHA"
            if wait_healthy; then
              echo "Rollback to $PREV_SHA succeeded; primary is healthy again."
            else
              echo "::error::Rollback to $PREV_SHA ALSO failed health checks on primary — manual intervention required."
            fi
            exit 1
          fi
          REMOTE

      - name: Deploy to standby box
        if: steps.changes.outputs.deploy == 'true'
        env:
          NEW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          [[ "$NEW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Bad NEW_SHA"; exit 1; }

          ssh standby "NEW_SHA=$NEW_SHA bash -s" << 'REMOTE'
          set -euo pipefail
          cd /root/cipherscan

          prev_sha="$(git rev-parse HEAD)"
          echo "$prev_sha" > /root/cipherscan/.previous-deploy-sha

          deploy_sha() {
            local sha="$1"
            git fetch origin main
            git merge-base --is-ancestor "$sha" origin/main
            git checkout --detach "$sha"
            # Shared lib modules resolve dependencies from the repository root.
            npm ci --omit=dev --no-audit --no-fund
            (cd server/api && npm ci --omit=dev --no-audit --no-fund)
            # Keep the failover checkout current without turning the database
            # standby into a second public API host. The primary API already
            # offloads eligible reads to this PostgreSQL replica directly.
            systemctl disable --now zcash-api-mainnet.service
          }

          echo "Preparing $NEW_SHA on passive standby"
          deploy_sha "$NEW_SHA"
          echo "Standby checkout ready at $NEW_SHA; API remains disabled and stopped"
          REMOTE

      - name: Verify
        # Runs even if the primary/standby deploy step above failed (e.g. it
        # rolled back and exited non-zero) so the final health state is
        # always visible — but only once SSH is actually configured.
        if: always() && steps.roles.outcome == 'success' && steps.changes.outputs.deploy == 'true'
        run: |
          echo "=== Primary API ==="
          ssh primary "curl -sf http://localhost:3001/health && echo && curl -sf http://localhost:3001/health/deep" \
            || echo "Primary health check failed"
          echo ""
          echo "=== Passive standby ==="
          ssh standby "printf 'api_active='; systemctl is-active zcash-api-mainnet.service || true; printf 'api_enabled='; systemctl is-enabled zcash-api-mainnet.service || true; printf 'pg_in_recovery='; sudo -u postgres psql -qtAX -c 'SELECT pg_is_in_recovery();'"
