name: Deploy API

# Deploy only after CI has actually finished and passed on main, and always
# deploy the exact commit CI validated — never whatever `origin/main` happens
# to point at by the time this workflow runs. A `push`-triggered "ci-gate"
# job (the previous approach) cannot see the outcome of another workflow; it
# just prints a message and always "passes", so a red CI run never blocked a
# deploy. `workflow_run` ties this workflow to a specific completed CI run
# and its `head_sha`, which is what we check out and ship.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  # workflow_run always runs workflow definitions from the default branch,
  # and we only ever react to CI runs on main (see branches filter above),
  # so a static group name is correct here (no risk of colliding refs).
  group: deploy-api-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy API to servers
    runs-on: ubuntu-latest
    environment: production
    # Branch names alone do not establish trust: fork PRs can also use main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - name: Checkout trusted release verifier
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
          # Full history so the "did anything relevant change" diff below
          # can compare against whatever commit is currently deployed,
          # however far back that is.
          fetch-depth: 0

      - name: Verify trusted release and select the exact tested commit
        run: python3 scripts/verify-deployment.py

      - name: Set up SSH
        env:
          PRIMARY_HOST: ${{ secrets.PRIMARY_HOST }}
          STANDBY_HOST: ${{ secrets.STANDBY_HOST }}
          TESTNET_HOST: ${{ secrets.TESTNET_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          # Pinned testnet keys live in their own secret so adding a host never
          # rewrites the established mainnet entries.
          printf '%s\n' "${{ secrets.TESTNET_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts || { echo "::error::DEPLOY_KNOWN_HOSTS is empty"; exit 1; }
          bash server/deploy/release/write-ssh-config.sh

      - name: Detect roles and current deployed commit
        id: roles
        run: |
          # targets.json names the writable mainnet database host. If the
          # roles have flipped (failover), the manifest is stale: stop rather
          # than restart the API on what is now a replica.
          primary_is_recovery=$(ssh zcash-mainnet "sudo -u postgres psql -qtAX -c 'SELECT pg_is_in_recovery();'")
          if [[ "$primary_is_recovery" != "f" ]]; then
            echo "::error::mainnet-primary PostgreSQL is in recovery; update targets.json before deploying"
            exit 1
          fi

          # This is also the backup/rollback reference: whatever commit is
          # currently live on the primary box before we touch anything.
          prev_sha="$(ssh zcash-mainnet 'cd /root/cipherscan && git rev-parse HEAD')"
          if [[ ! "$prev_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not read a valid current commit from primary (got: $prev_sha)"
            exit 1
          fi
          echo "Primary currently deployed at $prev_sha"
          echo "prev_sha=$prev_sha" >> "$GITHUB_OUTPUT"

      - name: Check whether API-relevant files changed
        id: changes
        env:
          NEW_SHA: ${{ github.event.workflow_run.head_sha }}
          PREV_SHA: ${{ steps.roles.outputs.prev_sha }}
        run: |
          if [[ "$NEW_SHA" == "$PREV_SHA" ]]; then
            echo "Primary is already at $NEW_SHA; nothing to deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif git cat-file -e "${PREV_SHA}^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$PREV_SHA" "$NEW_SHA" -- server lib package.json package-lock.json || true)"
            if [[ -z "$changed" ]]; then
              echo "No server/lib/package changes between $PREV_SHA and $NEW_SHA; skipping deploy."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
            else
              echo "Relevant changes since $PREV_SHA:"
              echo "$changed"
              echo "deploy=true" >> "$GITHUB_OUTPUT"
            fi
          else
            # PREV_SHA isn't reachable from this checkout (force-push/rebase
            # of main, or the very first run). Deploy rather than guess.
            echo "Cannot diff against $PREV_SHA (not reachable); deploying to be safe."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      # Every enabled host in targets.json receives the same commit through
      # the same script, streamed from this verified checkout. Order matters:
      # the mainnet primary goes first, and any failure stops the rollout so
      # no host moves past a release that failed elsewhere.
      - name: Deploy to every enabled target
        if: steps.changes.outputs.deploy == 'true'
        env:
          NEW_SHA: ${{ github.event.workflow_run.head_sha }}
          ENFORCE_MIGRATIONS: ${{ vars.ENFORCE_MIGRATIONS == 'true' && '1' || '0' }}
        run: |
          [[ "$NEW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Bad NEW_SHA"; exit 1; }
          jq -c '.targets[] | select(.deploy)' server/deploy/release/targets.json | while read -r target; do
            name=$(jq -r .name <<< "$target")
            alias=$(jq -r .ssh <<< "$target")
            grep -q "^Host $alias$" ~/.ssh/config \
              || { echo "::error::$name is enabled but its host secret is missing"; exit 1; }
            env_line="NETWORK=$(jq -r .network <<< "$target") ROLE=$(jq -r .role <<< "$target")"
            env_line+=" SERVICE=$(jq -r .service <<< "$target") PORT=$(jq -r .port <<< "$target")"
            env_line+=" ALSO_RESTART='$(jq -r '.alsoRestart | join(" ")' <<< "$target")'"
            env_line+=" ENFORCE_MIGRATIONS=$ENFORCE_MIGRATIONS"
            echo "::group::$name"
            ssh "$alias" "$env_line bash -s -- deploy $NEW_SHA" < server/deploy/release/host.sh
            echo "::endgroup::"
          done

      - name: Verify no drift across deployed targets
        if: always() && steps.roles.outcome == 'success' && steps.changes.outputs.deploy == 'true'
        run: |
          node server/deploy/release/drift-report.js --deployed-only | tee -a "$GITHUB_STEP_SUMMARY"
