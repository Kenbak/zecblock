name: Docker

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  # PR pushes supersede each other; every main/dev push must finish so each
  # merge commit has a complete result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lint every Dockerfile with hadolint
  # ---------------------------------------------------------------------------
  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install hadolint
        run: |
          curl -fsSL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint
          hadolint --version
      - name: Lint Dockerfiles
        run: hadolint --config .hadolint.yaml Dockerfile server/api/Dockerfile docker/zebra/Dockerfile

  # ---------------------------------------------------------------------------
  # Build the application images (web + api). No push.
  # ---------------------------------------------------------------------------
  build:
    name: Build image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: hadolint
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
            dockerfile: Dockerfile
          - name: api
            context: .
            dockerfile: server/api/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: cipherscan-${{ matrix.name }}:ci
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            NEXT_PUBLIC_NETWORK=mainnet
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: Smoke-test API image startup and liveness
        if: matrix.name == 'api'
        run: |
          docker network create cipherscan-api-smoke
          docker run --detach --name cipherscan-postgres-smoke \
            --network cipherscan-api-smoke \
            -e POSTGRES_USER=zcash_user \
            -e POSTGRES_PASSWORD=smoke-test-only \
            -e POSTGRES_DB=zcash_explorer_testnet \
            postgres:16-alpine
          # The initialization server accepts Unix sockets before the final
          # database is ready. Wait for TCP, which the API container uses.
          for attempt in $(seq 1 20); do
            if docker exec cipherscan-postgres-smoke \
              pg_isready -h 127.0.0.1 -U zcash_user -d zcash_explorer_testnet >/dev/null; then
              break
            fi
            sleep 1
          done
          docker exec cipherscan-postgres-smoke \
            pg_isready -h 127.0.0.1 -U zcash_user -d zcash_explorer_testnet
          docker run --detach --name cipherscan-api-smoke \
            --network cipherscan-api-smoke \
            -p 3001:3001 \
            -e DB_HOST=cipherscan-postgres-smoke \
            -e DB_NAME=zcash_explorer_testnet \
            -e DB_USER=zcash_user \
            -e DB_PASSWORD=smoke-test-only \
            cipherscan-api:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3001/health >/dev/null; then
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' cipherscan-api-smoke 2>/dev/null)" != "true" ]; then
              echo "API container exited before becoming healthy"
              docker logs cipherscan-api-smoke
              exit 1
            fi
            sleep 1
          done
          docker logs cipherscan-api-smoke
          exit 1
      - name: Stop API smoke-test container
        if: always() && matrix.name == 'api'
        run: |
          docker rm --force cipherscan-api-smoke >/dev/null 2>&1 || true
          docker rm --force cipherscan-postgres-smoke >/dev/null 2>&1 || true
          docker network rm cipherscan-api-smoke >/dev/null 2>&1 || true
