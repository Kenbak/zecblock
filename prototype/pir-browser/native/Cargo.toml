[package]
name = "zecblock-pir-fixture"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
zakura-pir-protocol = { path = "../.upstream/wallet-libraries/zakura/pir-protocol", default-features = false, features = ["native", "transparent"] }
zakura-pir-query-server = { path = "../.upstream/wallet-libraries/zakura/pir-query-server", default-features = false, features = ["transparent"] }
zakura-pir-server-core = { path = "../.upstream/wallet-libraries/zakura/pir-server-core", default-features = false, features = ["transparent"] }
zakura-pir-client = { path = "../.upstream/wallet-libraries/zakura/pir-client", default-features = false, features = ["transparent"] }
zakura-transaction-wire = { path = "../.upstream/wallet-libraries/zakura/transaction-wire" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
ed25519-dalek = { version = "=2.1.1", default-features = false }
miniz_oxide = "=0.8.9"
reinspiring = { path = "../.upstream/ipir-sp/reinspiring", version = "=0.1.3-rc.1" }
memmap2 = "=0.9.12"
libc = "=0.2.191"
rayon = "=1.12.0"
