
# Private explorer PIR queries (encrypted). Only the query routes are exposed,
# CORS is limited to the private frontend, and logs stay off (global setting).
pir.zecblock.com {
	@preflight {
		method OPTIONS
		header Origin https://private.zecblock.com
	}
	@query path /manifest /base/* /recent/* /blocks/* /blocks-recent/* /addresses/* /addresses-recent/* /address-pages/*
	header {
		-Server
		Strict-Transport-Security "max-age=31536000"
		X-Content-Type-Options nosniff
		Referrer-Policy no-referrer
		Access-Control-Allow-Origin https://private.zecblock.com
		Vary Origin
	}
	handle @preflight {
		header Access-Control-Allow-Methods "GET, POST"
		header Access-Control-Allow-Headers "Content-Type"
		header Access-Control-Max-Age 7200
		respond 204
	}
	handle @query {
		request_body {
			max_size 64MB
		}
		reverse_proxy 127.0.0.1:4391 {
			header_down -X-Server-Ns
			header_down -X-Batch
			transport http {
				max_conns_per_host 64
			}
		}
	}
	handle {
		respond 404
	}
}
