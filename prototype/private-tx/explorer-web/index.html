<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Private Transaction Lookup</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Private transaction lookup</h1>
    <p class="lede">Experimental test. The transaction ID never leaves this page: your browser sends an encrypted row selection, the server computes over every row of every table, and only this page can decrypt the answer.</p>
    <p id="snapshot" class="muted">Loading public parameters…</p>
  </header>
  <form id="form">
    <input id="txid" name="txid" autocomplete="off" spellcheck="false" placeholder="Transaction ID (64 hex characters)" aria-label="Transaction ID">
    <button id="go" type="submit" disabled>Look up privately</button>
  </form>
  <section id="timing" hidden>
    <h2>What happened</h2>
    <table><tbody id="timing-rows"></tbody></table>
  </section>
  <section id="result"></section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
