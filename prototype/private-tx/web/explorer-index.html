<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="description" content="Look up any Zcash mainnet transaction without revealing which one. Searches are encrypted in your browser.">
    <meta name="private-worker" content="/explorer-worker.js">
    <meta name="referrer" content="no-referrer">
    <title>Private Explorer · ZecBlock</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme');
          if (!theme || !localStorage.getItem('theme-user-set')) theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.classList.add(theme === 'light' ? 'light' : 'dark');
        } catch (e) { document.documentElement.classList.add('dark'); }
      })();
    </script>
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div id="app"><main class="private-main"><section class="home-hero-band"><div class="home-hero max-w-7xl mx-auto px-4 sm:px-6 lg:px-8"><div class="home-introduction"><h1 class="text-primary">The Zcash Private Explorer</h1><p class="home-hero-intro text-secondary">Look up any Zcash transaction without revealing which one. Your search is encrypted in your browser, so not even ZecBlock can see it.</p></div></div></section></main></div>
    <noscript><p class="max-w-7xl mx-auto px-4 text-sm text-secondary">Private search needs JavaScript and WebAssembly.</p></noscript>
  </body>
</html>
