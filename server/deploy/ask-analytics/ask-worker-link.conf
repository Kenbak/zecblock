# Production API to analytics worker link; local forward to the worker only.
Match User ask_api_link
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding local
    AllowStreamLocalForwarding no
    PermitOpen 127.0.0.1:3015
    PermitListen none
    MaxSessions 0
    PermitTunnel no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitUserRC no
    ForceCommand /usr/sbin/nologin
Match all
