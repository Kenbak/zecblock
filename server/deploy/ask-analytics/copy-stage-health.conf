# /etc/systemd/system/zecblock-ask-bootstrap-health.service.d/copy-stage.conf
# Install only when the single native subscription and copying state exist.
[Unit]
Description=Read-only analytics copy-stage checks (journal only)
[Service]
ExecStart=
ExecStart=/usr/bin/python3 /opt/zecblock-ask-operations/host-health.py --stage copying
