# Install as /etc/systemd/system/cipherscan-api-crosslink.service.d/zecblock-v1.conf
# Required by the ZecBlock frontend's enveloped /v1 transport.
[Service]
Environment=API_V1_ENABLED=true
Environment=API_V1_LAUNCHED=true
Environment=NEXT_PUBLIC_NETWORK=crosslink-testnet
Environment=V1_INTERNAL_API_BASE_URL=http://127.0.0.1:3001
