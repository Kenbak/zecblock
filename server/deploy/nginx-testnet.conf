# Testnet API reverse proxy: /etc/nginx/sites-available/cipherscan (legacy
# api.testnet.cipherscan.app host) and /etc/nginx/sites-available/
# zecblock-testnet (api.testnet.zecblock.com), concatenated here. Mainnet uses
# Caddy instead (see Caddyfile.example); testnet still runs nginx + certbot.
#
# X-Forwarded-For is overwritten with the peer address, never appended. The API
# sets `trust proxy 1` and keys its HTTP and WebSocket rate limits on that
# header, so passing a client-supplied value through would let any caller pick
# its own rate-limit identity. Request rate limiting lives in the API (which
# exempts the frontend's service key), not in nginx.

# ---- /etc/nginx/sites-available/cipherscan ----

server {
    server_name api.testnet.cipherscan.app;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Overwrite, never append: see the header comment.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.testnet.cipherscan.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.testnet.cipherscan.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    listen 80 default_server;
    server_name _;

    location /health {
        proxy_pass http://127.0.0.1:3001/health;
    }

    location / {
        return 404;
    }
}


server {
    if ($host = api.testnet.cipherscan.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name api.testnet.cipherscan.app;
    return 404; # managed by Certbot


}

# ---- /etc/nginx/sites-available/zecblock-testnet ----
server {
    listen 80;
    server_name api.testnet.zecblock.com;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    server_name api.testnet.zecblock.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Overwrite, never append: see the header comment.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.testnet.zecblock.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.testnet.zecblock.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
