[package]
name = "zcash-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# WASM essentials
wasm-bindgen = "=0.2.127"
console_error_panic_hook = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Use one compatible Common release for parser, protocol types and note encryption.
# secp256k1 is optional in Common 4; do not enable transparent-inputs/circuits.
orchard = { package = "zakura-orchard", version = "=4.0.0", default-features = false, features = ["std", "backend-halo2", "zip32-addresses"] }
zcash_primitives = { package = "zakura-primitives", version = "=4.0.0", default-features = false, features = ["std", "backend-halo2"] }
zcash_note_encryption = { package = "zakura-note-encryption", version = "=4.0.0" }

# Encoding
hex = "0.4"
bs58 = { version = "0.5", features = ["check"] }

# Zcash address parsing (for UFVK)
zcash_address = { package = "zakura-address", version = "=4.0.0" }
zcash_protocol = { package = "zakura-protocol", version = "=4.0.0" }

[profile.release]
opt-level = 3       # Favor repeated scan throughput; see BUILD.md benchmark
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce parallel codegen units
